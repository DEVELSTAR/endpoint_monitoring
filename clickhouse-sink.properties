# Connector properties
name=clickhouse-sink-connector
connector.class=com.clickhouse.kafka.connect.ClickHouseSinkConnector
tasks.max=2

# Topics to subscribe to
topics=internet-quality,router-metrics

# ClickHouse connection details (Default HTTP port is 8123)
hostname=localhost
port=8123
database=default
username=default
password=

# Topic-to-Table mapping
# Format: <topic1>:<table1>,<topic2>:<table2>
# clickhouse.table=internet_quality_raw
clickhouse.topic2table.map=internet-quality:internet_quality_raw,router-metrics:router_metrics_raw

# Field mapping to ensure status field is properly handled
# This ensures the status field from JSON is correctly mapped to ClickHouse
clickhouse.fields.mapping=status:status

# Batching options (Essential for ClickHouse performance)
# Large batches help avoid 'Too many parts' error in ClickHouse.
batchSize=5000
flushIntervalMs=3000

# Error Handling (Optional: configure a Dead Letter Queue)
# errors.tolerance=all
# errors.deadletterqueue.topic.name=kafka-connect-errors
# errors.deadletterqueue.context.headers.enable=true
