                    type: integer
                    example: 3600
                  checks:
                    type: object
                    properties:
                      database_primary:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: Primary database connection successful
                          query_time_ms:
                            type: number
                            example: 1.5
                          adapter:
                            type: string
                            example: postgresql
                          database:
                            type: string
                            example: endpoint_monitoring_development
                      database_legacy:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: Legacy database connection successful
                          query_time_ms:
                            type: number
                            example: 2.1
                          adapter:
                            type: string
                            example: mysql2
                          database:
                            type: string
                            example: cloud_controller
                      clickhouse:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: ClickHouse connection successful
                          query_time_ms:
                            type: number
                            example: 10.5
                          adapter:
                            type: string
                            example: clickhouse-activerecord
                          database:
                            type: string
                            example: default
                      redis:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: Redis connection successful
                          response_time_ms:
                            type: number
                            example: 0.8
                          redis_url:
                            type: string
                            example: redis://127.0.0.1:6379/12
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          message:
                            type: string
                            example: Rails cache successful
                          response_time_ms:
                            type: number
                            example: 0.5
                          cache_store:
                            type: string
                            example: ActiveSupport::Cache::RedisCacheStore
        '401':
          description: Unauthorized
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  timestamp:
                    type: string
                    format: date-time
                  uptime:
                    type: integer
                    example: 3600
                  checks:
                    type: object
