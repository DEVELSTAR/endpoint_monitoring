  "/api/v1/dashboard/resource_list":
    get:
      summary: Get dashboard filter dropdown values
      tags:
      - Dashboard
      description: Returns distinct values for all filterable fields to populate dashboard
        filter dropdowns. Supports cascading filters.
      operationId: getResourceList
      security:
      - api_key: []
      parameters:
      - name: device_id
        in: query
        required: false
        description: Filter by device ID to narrow down other field options
        schema:
          type: string
      - name: host
        in: query
        required: false
        description: Filter by hostname to narrow down other field options
        schema:
          type: string
      - name: endpoint_id
        in: query
        required: false
        description: Filter by endpoint ID to narrow down other field options
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: Filter by region to narrow down other field options
        schema:
          type: string
      - name: location_network_id
        in: query
        required: false
        description: Filter by location network ID to narrow down other field options
        schema:
          type: string
      - name: router_inventory_id
        in: query
        required: false
        description: Filter by router inventory ID to narrow down other field options
        schema:
          type: string
      - name: isp
        in: query
        required: false
        description: Filter by ISP to narrow down other field options
        schema:
          type: string
      responses:
        '200':
          description: Empty resource list when no data matches filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  mac_ids:
                    type: array
                    items:
                      type: string
                    description: List of unique device IDs
                  hosts:
                    type: array
                    items:
                      type: string
                    description: List of unique hostnames
                  endpoint_ids:
                    type: array
                    items:
                      type: string
                    description: List of unique endpoint IDs
                  regions:
                    type: array
                    items:
                      type: string
                    description: List of unique regions
                  location_network_ids:
                    type: array
                    items:
                      type: string
                    description: List of unique location network IDs
                  router_inventory_ids:
                    type: array
                    items:
                      type: string
                    description: List of unique router inventory IDs
                  isps:
                    type: array
                    items:
                      type: string
                    description: List of unique ISPs
                required:
                - mac_ids
                - hosts
                - endpoint_ids
                - regions
                - location_network_ids
                - router_inventory_ids
                - isps
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '400':
          description: Bad Request - Missing organisation_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Internal Server Error - ClickHouse query failure
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/dashboard/location_endpoints":
    get:
      summary: Get location-wise endpoint counts
      tags:
      - Dashboard
      description: Returns endpoint counts (total/good/warning/critical/down) grouped
        by region or location network. Only counts endpoints that exist in the database.
      operationId: getLocationEndpointCounts
      security:
      - api_key: []
      parameters:
      - name: group_by
        in: query
        required: false
        description: "Group data by specified field:\n * `regions` \n * `locations`
          \n "
        enum:
        - regions
        - locations
        default: regions
        schema:
          type: string
      - name: start_time
        in: query
        required: false
        description: Start time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: end_time
        in: query
        required: false
        description: End time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: host
        in: query
        required: false
        description: Filter by hostname
        schema:
          type: string
      - name: endpoint_id
        in: query
        required: false
        description: Filter by specific endpoint ID
        schema:
          type: integer
      - name: isp
        in: query
        required: false
        description: Filter by ISP
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: Filter by region
        schema:
          type: string
      - name: location_id
        in: query
        required: false
        description: Filter by location network ID
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        description: Filter by device MAC address
        schema:
          type: string
      - name: router_id
        in: query
        required: false
        description: Filter by router inventory ID
        schema:
          type: integer
      responses:
        '200':
          description: Successful location endpoint counts grouped by locations
          content:
            application/json:
              examples:
                example_0:
                  value:
                    success_response:
                      value:
                        time_window:
                          start_time: '2026-04-01T10:27:25.765Z'
                          end_time: '2026-04-02T10:27:25.765Z'
                        group_by: regions
                        data:
                        - region: Delhi
                          count: 4
                          good: 2
                          warning: 0
                          critical: 1
                          down: 1
                        - region: Mumbai
                          count: 4
                          good: 1
                          warning: 0
                          critical: 0
                          down: 3
                        - region: Bangalore
                          count: 3
                          good: 0
                          warning: 1
                          critical: 2
                          down: 0
              schema:
                type: object
                properties:
                  time_window:
                    type: object
                    properties:
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                  group_by:
                    type: string
