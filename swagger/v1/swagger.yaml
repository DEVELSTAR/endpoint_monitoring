---
openapi: 3.0.1
info:
  title: Endpoint Monitoring API
  version: v1
  description: API documentation for Endpoint Monitoring Dashboard
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-AUTH-TOKEN
      in: header
paths:
  "/api/v1/dashboard/latency_analysis":
    get:
      summary: Get latency analysis data
      tags:
      - Dashboard
      description: Returns latency analysis data with response efficiency percentages
        and grouped data
      operationId: getLatencyAnalysis
      security:
      - api_key: []
      parameters:
      - name: group_by
        in: query
        required: false
        description: "Group data by specified field:\n * `endpoint_id` \n * `host`
          \n * `device_id` \n * `region` \n * `location_id` \n * `router_id` \n *
          `isp` \n * `isp_region` \n "
        enum:
        - endpoint_id
        - host
        - device_id
        - region
        - location_id
        - router_id
        - isp
        - isp_region
        default: endpoint_id
        schema:
          type: string
      - name: last_minutes
        in: query
        required: false
        description: Time window in minutes from now
        default: 1440
        schema:
          type: integer
      - name: start_time
        in: query
        required: false
        description: Start time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: end_time
        in: query
        required: false
        description: End time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: host
        in: query
        required: false
        description: Filter by hostname
        schema:
          type: string
      - name: endpoint_id
        in: query
        required: false
        description: Filter by specific endpoint ID
        schema:
          type: integer
      - name: isp
        in: query
        required: false
        description: Filter by ISP
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: Filter by region
        schema:
          type: string
      - name: location_id
        in: query
        required: false
        description: Filter by location network ID
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        description: Filter by device MAC address
        schema:
          type: string
      - name: router_id
        in: query
        required: false
        description: Filter by router inventory ID
        schema:
          type: string
      - name: sites_type
        in: query
        required: false
        description: Filter by site performance type
        enum:
        - good
        - warning
        - critical
        - down
        schema:
          type: string
      responses:
        '200':
          description: Successful latency analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_window:
                    type: object
                    properties:
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                  group_by:
                    type: string
                  response_efficiency:
                    type: object
                    properties:
                      good:
                        type: number
                      warning:
                        type: number
                      critical:
                        type: number
                      down:
                        type: number
                      total_count:
                        type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint_id:
                          type: integer
                        host:
                          type: string
                        device_id:
                          type: string
                        region:
                          type: string
                        location_id:
                          type: string
                        router_id:
                          type: string
                        isp:
                          type: string
                        status:
                          type: string
                          enum:
                          - good
                          - warning
                          - critical
                          - down
                        group:
                          type: string
                          nullable: true
                        type:
                          type: string
                          nullable: true
                        regions:
                          type: array
                          items:
                            type: string
                          description: Array of unique regions where this endpoint
                            has monitoring data (only when group_by=endpoint_id)
                        avg_latency_ms:
                          type: number
                        sample_count:
                          type: integer
                        endpoint_count:
                          type: integer
                        device_count:
                          type: integer
                        location_count:
                          type: integer
  "/api/v1/dashboard/site_distribution":
    get:
      summary: Get site distribution data
      tags:
      - Dashboard
      description: Returns site distribution analysis with majority vote classification
        and latency bucket distribution
      operationId: getSiteDistribution
      security:
      - api_key: []
      parameters:
      - name: group_by
        in: query
        required: false
        description: "Group data by specified field:\n * `endpoint_id` \n * `host`
          \n * `device_id` \n * `region` \n * `location_id` \n * `router_id` \n *
          `isp` \n * `isp_region` \n "
        enum:
        - endpoint_id
        - host
        - device_id
        - region
        - location_id
        - router_id
        - isp
        - isp_region
        default: endpoint_id
        schema:
          type: string
      - name: bucket_size
        in: query
        required: false
        description: Latency bucket size in milliseconds for distribution
        default: 20
        schema:
          type: integer
      - name: last_minutes
        in: query
        required: false
        description: Time window in minutes from now
        default: 1440
        schema:
          type: integer
      - name: start_time
        in: query
        required: false
        description: Start time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: end_time
        in: query
        required: false
        description: End time for analysis (ISO 8601 format)
        schema:
          type: string
      - name: host
        in: query
        required: false
        description: Filter by hostname
        schema:
          type: string
      - name: endpoint_id
        in: query
        required: false
        description: Filter by specific endpoint ID
        schema:
          type: integer
      - name: isp
        in: query
        required: false
        description: Filter by ISP
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: Filter by region
        schema:
          type: string
      - name: location_id
        in: query
        required: false
        description: Filter by location network ID
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        description: Filter by device MAC address
        schema:
          type: string
      - name: router_id
        in: query
        required: false
        description: Filter by router inventory ID
        schema:
          type: string
      - name: sites_type
        in: query
        required: false
        description: Filter by site performance type
        enum:
        - good
        - warning
        - critical
        - down
        schema:
          type: string
      responses:
        '200':
          description: Successful site distribution analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_window:
                    type: object
                    properties:
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                  group_by:
                    type: string
                  bucket_size:
                    type: integer
                    description: Latency bucket size in milliseconds
                  summary:
                    type: object
                    properties:
                      count:
                        type: integer
                        description: Total number of groups
                      good:
                        type: integer
                        description: Number of good groups
                      warning:
                        type: integer
                        description: Number of warning groups
                      critical:
                        type: integer
                        description: Number of critical groups
                      down:
                        type: integer
                        description: Number of down groups
                  distribution:
                    type: array
                    description: Distribution of groups across latency buckets
                    items:
                      type: object
                      properties:
                        latency_range:
                          type: string
                          description: Latency range (e.g., "0-19ms")
                        latency_bucket:
                          type: integer
                          description: Bucket start value in ms
                        count:
                          type: integer
                          description: Number of groups in this bucket
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/dashboard/uplink_timeseries":
    get:
      summary: Get uplink timeseries data
      tags:
      - Dashboard
      description: Returns device-level uplink performance timeseries with latency
        and packet loss metrics grouped by uplink
      operationId: getUplinkTimeseries
      security:
      - api_key: []
      parameters:
      - name: device_id
        in: query
        required: true
        description: Device MAC address identifier
        example: 00:11:22:33:44:55
        schema:
          type: string
      - name: uplink_id
        in: query
        required: false
        description: Filter by specific uplink identifier
        example: uplink-001
        schema:
          type: string
      - name: uplink_type
        in: query
        required: false
        description: "Filter by uplink type:\n * `primary` \n * `secondary` \n "
        enum:
        - primary
        - secondary
        example: primary
        schema:
          type: string
      - name: bucket_minutes
        in: query
        required: false
        description: Time bucket size in minutes for data aggregation (default 1)
        default: 1
        example: 5
        schema:
          type: integer
      - name: start_time
        in: query
        required: false
        description: Start time for analysis (ISO 8601 format)
        example: '2025-01-01T00:00:00Z'
        schema:
          type: string
      - name: end_time
        in: query
        required: false
        description: End time for analysis (ISO 8601 format)
        example: '2025-01-01T23:59:59Z'
        schema:
          type: string
      - name: last_minutes
        in: query
        required: false
        description: Time window in minutes from now (alternative to start_time/end_time)
        default: 1440
        example: 60
        schema:
          type: integer
      responses:
        '200':
          description: Successful uplink timeseries analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_window:
                    type: object
                    description: Time window for the analysis
                    properties:
                      start_time:
                        type: string
                        format: date-time
                        example: '2025-01-01T00:00:00Z'
                      end_time:
                        type: string
                        format: date-time
                        example: '2025-01-01T23:59:59Z'
                      bucket_minutes:
                        type: integer
                        description: Bucket size in minutes
                        example: 5
                  latency:
                    type: array
                    description: Latency timeseries data grouped by uplink
                    items:
                      type: object
                      properties:
                        uplink_id:
                          type: string
                          description: Uplink identifier
                          example: uplink-001
                        uplink_type:
                          type: string
                          description: Type of uplink (primary/secondary)
                          example: primary
                        timeseries:
                          type: array
                          description: Latency data points over time
                          items:
                            type: object
                            properties:
                              timestamp:
                                type: string
                                format: date-time
                                description: Timestamp of the data point
                                example: '2025-01-01T12:00:00Z'
                              epoch_ts:
                                type: integer
                                description: Unix epoch timestamp in seconds
                                example: 1735732800
                              time_ago:
                                type: string
                                description: Human-readable time difference from now
                                example: 2h ago
                              avg_latency_ms:
                                type: number
                                description: Average latency in milliseconds
                                example: 25.5
                              sample_count:
                                type: integer
                                description: Number of samples in this time bucket
                                example: 100
                  loss:
                    type: array
                    description: Packet loss timeseries data grouped by uplink
                    items:
                      type: object
                      properties:
                        uplink_id:
                          type: string
                          description: Uplink identifier
                          example: uplink-001
                        uplink_type:
                          type: string
                          description: Type of uplink (primary/secondary)
                          example: primary
                        timeseries:
                          type: array
                          description: Packet loss data points over time
                          items:
                            type: object
                            properties:
                              timestamp:
                                type: string
                                format: date-time
                                description: Timestamp of the data point
                                example: '2025-01-01T12:00:00Z'
                              epoch_ts:
                                type: integer
                                description: Unix epoch timestamp in seconds
                                example: 1735732800
                              time_ago:
                                type: string
                                description: Human-readable time difference from now
                                example: 2h ago
                              avg_loss_pct:
                                type: number
                                description: Average packet loss percentage
                                example: 1.2
                              sample_count:
                                type: integer
                                description: Number of samples in this time bucket
                                example: 100
        '400':
          description: Bad Request - Missing device_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: device_id is required
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid authentication token
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: An error occurred while processing the request
  "/api/v1/dashboard/endpoint_timeseries":
    get:
      summary: Get full timeseries for a single endpoint
      tags:
      - Dashboard
      description: Returns 24-hour buckted timeseries performance data for a single
        endpoint
      operationId: getEndpointTimeseries
      security:
      - api_key: []
      parameters:
      - name: endpoint_id
        in: query
        required: true
        description: Endpoint ID for which to fetch the timeseries
        schema:
          type: integer
      - name: date
        in: query
        required: false
        format: date
        description: Filter by specific date (YYYY-MM-DD format). Returns data for
          the full day.
        schema:
          type: string
      - name: bucket_minutes
        in: query
        required: false
        description: Time bucket size in minutes for data aggregation (default 15)
        schema:
          type: integer
      - name: start_time
        in: query
        required: false
        description: Start time for analysis (ISO 8601 format). Use date parameter
          for single day queries.
        schema:
          type: string
      - name: end_time
        in: query
        required: false
        description: End time for analysis (ISO 8601 format). Use date parameter for
          single day queries.
        schema:
          type: string
      - name: host
        in: query
        required: false
        description: Filter by hostname
        schema:
          type: string
      - name: isp
        in: query
        required: false
        description: Filter by ISP
        schema:
          type: string
      - name: region
        in: query
        required: false
        description: Filter by region
        schema:
          type: string
      - name: location_id
        in: query
        required: false
        description: Filter by location network ID
        schema:
          type: string
      - name: device_id
        in: query
        required: false
        description: Filter by device MAC address
        schema:
          type: string
      - name: router_id
        in: query
        required: false
        description: Filter by router inventory ID
        schema:
          type: string
      responses:
        '200':
          description: Successful endpoint timeseries data retrieval
          content:
            application/json:
              schema:
                type: object
                properties:
                  time_window:
                    type: object
                    properties:
                      start_time:
                        type: string
                        format: date-time
                      end_time:
                        type: string
                        format: date-time
                  response_efficiency:
                    type: object
                    properties:
                      good:
                        type: number
                      warning:
                        type: number
                      critical:
                        type: number
                      down:
                        type: number
                      total_count:
                        type: number
                  endpoint:
                    type: object
                    properties:
                      endpoint_id:
                        type: string
                      host:
                        type: string
                      group_name:
                        type: string
                      type:
                        type: string
                  timeseries:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                        time_ago:
                          type: string
                        response_time:
                          type: number
                          nullable: true
                        status:
                          type: string
                  devices_details:
                    type: array
                    items:
                      type: object
                      properties:
                        router_inventory_id:
                          type: string
                        mac_address:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
                        time_ago:
                          type: string
                        response_time:
                          type: number
                          nullable: true
                        status:
                          type: string
