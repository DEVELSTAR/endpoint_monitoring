# bootstrap.servers: Host and port of your Kafka broker(s)
bootstrap.servers=localhost:9092

# key.converter: Converter for message keys
key.converter=org.apache.kafka.connect.storage.StringConverter
# value.converter: Converter for message values (assuming JSON)
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false

# Internal offset storage (for standalone mode)
offset.storage.file.filename=/tmp/connect.offsets
offset.flush.interval.ms=10000

# plugin.path: Directory containing your ClickHouse connector JAR
plugin.path=/Users/akibu/kafka-connect-plugins

# Avoid port 8083 conflict
listeners=http://localhost:8084
